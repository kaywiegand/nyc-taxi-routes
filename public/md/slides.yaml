hub:
  headline_kpis_from: einstieg-title-overview
  tagline: "Nachfrage- und Routenanalyse für die JFK-Flottenplanung"
  subtitle: "Data-Analysis-Projekt mit Routen-Klassifikation"
  footer_tagline: "NYC · Yellow Taxi · Flottenplanung JFK"
  about:
    - label: "Motivation"
      text: "Ein NYC-Taxiunternehmer plant seine Flotte und will wissen, wie viele Fahrzeuge an den Flughafen JFK gehören. JFK liegt weit vom Zentrum — wer dort absetzt, wartet lange auf die nächste Fahrt, dafür fahren JFK-Gäste längere, lukrativere Strecken."
    - label: "Kernfrage"
      text: "Wie groß ist das JFK-Geschäft im Vergleich zum Gesamtvolumen, wie viel Umsatz hängt daran, und wie stark schwankt die Nachfrage über Wochentag und Uhrzeit? <strong>1,93 % der Fahrten</strong> starten am JFK, sie bringen aber rund <strong>10 % des Fahrpreis-Umsatzes</strong> — etwa das Vierfache je Fahrt."
    - label: "Vorgehen"
      text: "Jede der 293.369 bereinigten Fahrten wird über zwei Bounding-Boxes klassifiziert (JFK / NYC / Other) und einem von neun Routentypen zugeordnet. Darauf setzen die Auswertungen zu Umsatzanteil, Wochentag- und Stundenverteilung auf."
    - label: "Ergebnis & Grenzen"
      text: "JFK ist eine kleine, aber überproportional wertvolle Nische mit klarem Wochen- und Tagesrhythmus — Montag 1,35× über, Samstag 0,75× unter dem Schnitt, JFK-Abendspitze 17:00 statt 18:00. Der Datensatz enthält keine Flottengröße, deshalb sind alle Empfehlungen relative Faktoren, keine Stückzahlen."
